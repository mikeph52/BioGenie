package:
  name: biogenie
  version: "1.1.0"

source:
  url: https://github.com/mikeph52/BioGenie/archive/refs/tags/v.1.1.0.tar.gz
  sha256: a631637fd29b2b2c2323c202831a63765048003b8d1901f93f35c2199b839fbd

build:
  number: 0
  script:
    - mkdir -p $PREFIX/bin
    - $CXX -std=c++17 -o $PREFIX/bin/biogenie main.cpp 

requirements:
  build:
    - {{ compiler('cxx') }}    

about:
  home: https://github.com/mikeph52/BioGenie
  license: GPL-3.0
  summary: "BioGenie is a complete bioinformatics command line tool, written in C++."