package:
  name: biogenie
  version: "1.2.2"

source:
  url: https://github.com/mikeph52/BioGenie/archive/refs/tags/v.1.2.2.tar.gz
  sha256: 0c3edd66e995433f7c186507e54c5d06748c84d3d1f5589415d7d9ff743e29e4

build:
  number: 0
  script:
    - mkdir -p $PREFIX/bin
    - $CXX -std=c++17 -o $PREFIX/bin/biogenie main.cpp 

requirements:
  build:
    - {{ compiler('cxx') }}    

about:
  home: https://github.com/mikeph52/BioGenie
  license: GPL-3.0
  summary: "BioGenie is a complete bioinformatics command line tool, written in C++."