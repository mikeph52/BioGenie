package:
  name: biogenie
  version: "1.2.2"

source:
  url: https://github.com/mikeph52/BioGenie/archive/refs/tags/v.1.2.2.tar.gz
  sha256: 384ce261f12facce28ef0c6061aae666c6959e97ffbcb05fbfe0fa53e767cf35

build:
  number: 1
  script:
    - mkdir -p $PREFIX/bin                                              
    - $CXX -std=c++17 -o $PREFIX/bin/biogenie main.cpp                 
    - if not exist %LIBRARY_BIN% mkdir %LIBRARY_BIN%                   
    - '%CXX% -std=c++17 -Fe:%LIBRARY_BIN%\biogenie.exe main.cpp'    

requirements:
  build:
    - {{ compiler('cxx') }}

about:
  home: https://github.com/mikeph52/BioGenie
  license: GPL-3.0
  summary: "BioGenie is a complete bioinformatics command line tool, written in C++."

extra:
  recipe-maintainers:
    - mikeph52